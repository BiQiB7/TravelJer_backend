<!DOCTYPE html>
<html>
<head>
    <title>Map with Search and Coordinate Display</title>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCxq4kM5hb4lVVTQyNupIXu1dxp8WEm_Sw&libraries=places&callback=initMap" async defer></script>
    <style>
        /* Basic styling for the map and UI elements */
        #map { height: 100%; }
        html, body { height: 100%; margin: 0; padding: 0; }
        
        .map-control {
            background-color: #fff;
            font-family: Roboto, sans-serif;
            border: 1px solid #ccc;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
            margin: 10px;
            padding: 8px 12px;
            text-overflow: ellipsis;
            width: 300px;
        }

        #search-box {
            font-size: 15px;
            font-weight: 300;
        }

        #info-box {
            font-size: 14px;
            margin-top: 0; /* Stack directly below the search box */
            color: #333;
        }
    </style>
</head>
<body>
    <!-- The div where the map will be displayed -->
    <div id="map"></div>

    <script>
        function initMap() {
            // 1. Create the initial map
            const mapOptions = {
                zoom: 4,
                center: { lat: 39.8283, lng: -98.5795 }, // Center of the USA
                mapTypeControl: false, // Optional: clean up the UI
                streetViewControl: false
            };
            const map = new google.maps.Map(document.getElementById('map'), mapOptions);

            // 2. Create UI Elements
            const searchInput = document.createElement('input');
            searchInput.id = 'search-box';
            searchInput.type = 'text';
            searchInput.placeholder = 'Search for a location...';
            searchInput.classList.add('map-control');

            const infoBox = document.createElement('div');
            infoBox.id = 'info-box';
            infoBox.classList.add('map-control');
            infoBox.textContent = 'Click on the map or search to see coordinates.';

            // Position the UI elements on the top-left of the map
            map.controls[google.maps.ControlPosition.TOP_LEFT].push(searchInput);
            map.controls[google.maps.ControlPosition.TOP_LEFT].push(infoBox);
            
            // Create a single marker that we can move around
            const marker = new google.maps.Marker({ map: map });

            // 3. Set up the Search Box Autocomplete
            const searchBox = new google.maps.places.Autocomplete(searchInput);
            searchBox.bindTo('bounds', map); // Bias search results to the map's viewport

            // 4. Listen for events
            
            // Event listener for when a place is selected from the search box
            searchBox.addListener('place_changed', () => {
                const place = searchBox.getPlace();

                if (!place.geometry || !place.geometry.location) {
                    window.alert("No details available for input: '" + place.name + "'");
                    return;
                }

                // Center the map on the new place and update the marker
                if (place.geometry.viewport) {
                    map.fitBounds(place.geometry.viewport);
                } else {
                    map.setCenter(place.geometry.location);
                    map.setZoom(17);
                }
                marker.setPosition(place.geometry.location);
                marker.setVisible(true);

                // Update the info box with the coordinates
                const lat = place.geometry.location.lat();
                const lng = place.geometry.location.lng();
                infoBox.textContent = `Lat: ${lat.toFixed(6)}, Lng: ${lng.toFixed(6)}`;
            });
            
            // Event listener for when the user clicks on the map
            map.addListener('click', (event) => {
                const clickedLatLng = event.latLng;
                
                // Move the marker to the clicked position
                marker.setPosition(clickedLatLng);
                marker.setVisible(true);
                
                // Update the info box with the coordinates
                const lat = clickedLatLng.lat();
                const lng = clickedLatLng.lng();
                infoBox.textContent = `Lat: ${lat.toFixed(6)}, Lng: ${lng.toFixed(6)}`;
            });
        }
    </script>
</body>
</html>
